[rtl_sdr]
sample_rate = 1024000
center_freq_mhz = 126.200
gain_mode = 0
tuner_gain = 400     ; in tenths of dB (e.g., 90 = 9.0 dB), only used when gain_mode = 1
ppm_correction = 1   ; frequency correction in PPM (0 = disabled)

fm_mode = am    ; am, wide or narrow

[audio]
audio_rate = 48000
mp3_bitrate = 128
mp3_quality = 2
audio_buffer_seconds = 2

[audio_filters]
lowcut_enabled = true    ; true or false
lowcut_freq = 500.0      ; in Hz, frequencies below this will be attenuated
lowcut_order = 4         ; filter order (higher = steeper cutoff, but more CPU)

[squelch]
enabled = true    ; true or false
threshold = -28.0  ; in dB, signals below this will be muted
hold_time = 500    ; in milliseconds, how long to keep squelch open after signal drops

[icecast]
host = kapsi.fi
port = 62780
mount = /dev.mp3
station_title=Streaming airband
password = hackme
user = source
protocol = http    ; only http is supported for now
format = mp3
reconnect_attempts = 5
reconnect_delay_ms = 100 

[scanner]
scan = true
step_delay = 50 ; ms

[scanlist]
